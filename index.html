<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFEX Mining - Gold Edition</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- MONETAG SDK FOR TELEGRAM MINI APP -->
    <script src="https://libtl.com/sdk.js" data-zone="11929290" data-sdk="show_11929290" data-auto="2/0.1/30/5/0"></script>
    
    <!-- GOOGLE MEDIAPIPE FACE DETECTION -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #080c14; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.03); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: rgba(234, 179, 8, 0.25); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(234, 179, 8, 0.5); }
        
        input[type="number"] { color-scheme: dark; background-color: transparent; }

        .glow-circle { box-shadow: 0 0 45px rgba(234, 179, 8, 0.2); }
        .gold-border { border: 1px solid rgba(234, 179, 8, 0.35); }
        .gold-card-bg { background: linear-gradient(135deg, rgba(22, 31, 51, 0.95) 0%, rgba(35, 26, 9, 0.6) 100%); }
        #custom-modal, #kyc-modal { transition: opacity 0.3s ease, transform 0.3s ease; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen flex flex-col justify-between pb-24 relative select-none">

    <!-- MAIN CONTAINER -->
    <div class="p-4 flex-1 z-10 relative">
        
        <!-- HEADER PROFILE & STATS -->
        <div class="flex justify-between items-center mb-4 relative z-20 gap-2">
            <div class="bg-[#121927] px-3 py-1.5 rounded-xl gold-border flex items-center gap-2">
                <div class="relative">
                    <div class="w-8 h-8 rounded-full flex items-center justify-center border-2 border-yellow-500 bg-amber-500 text-black font-black text-xs shadow-[0_0_10px_rgba(234,179,8,0.4)]">
                        <span id="header-avatar-letter">C</span>
                    </div>
                </div>
                <div>
                    <span id="header-username" class="text-xs font-bold text-white block">Carmelo</span>
                    <span class="text-[10px] text-gray-400">ID: <span id="header-acc" class="font-mono text-yellow-500">8821716544</span></span>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <!-- MULTI LANGUAGE SELECTOR -->
                <select id="lang-select" onchange="changeLanguage(this.value)" class="bg-[#121927] gold-border text-yellow-400 text-[10px] rounded-xl px-2 py-2 outline-none font-bold cursor-pointer">
                    <option value="en" selected>🇬🇧 English</option>
                    <option value="id">🇮🇩 Indonesia</option>
                </select>

                <div class="bg-[#121927] px-2.5 py-1.5 rounded-xl gold-border text-right flex items-center">
                    <span id="header-usdt" class="text-xs font-mono font-bold text-green-400">$1.20</span>
                </div>
            </div>
        </div>

        <!-- 5. TAB 5: PROFILE PAGE -->
        <div id="tab-profile" class="tab-content active relative z-25 space-y-3 pb-6">
            <!-- Header User Card -->
            <div class="bg-[#121927] p-4 rounded-2xl gold-border flex items-center justify-between shadow-lg">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-full bg-amber-500 text-black font-black flex items-center justify-center text-xl shadow-md border-2 border-yellow-400">
                        <span id="profile-avatar-initial">C</span>
                    </div>
                    <div>
                        <h3 id="profile-display-name" class="text-sm font-bold text-white">Carmelo</h3>
                        <p id="profile-username" class="text-xs text-gray-400 font-mono">@Carmelohand32</p>
                    </div>
                </div>
            </div>

            <!-- YOUR UID SECTION -->
            <div class="bg-[#121927] p-4 rounded-2xl gold-border flex items-center justify-between shadow-lg">
                <div>
                    <span class="text-[10px] text-gray-400 tracking-wider block uppercase">YOUR UID</span>
                    <span id="profile-uid" class="text-base font-mono font-bold text-white tracking-widest">8821716544</span>
                </div>
                <button onclick="copyUID()" class="w-9 h-9 bg-[#080c14] border border-gray-800 rounded-xl flex items-center justify-center text-yellow-400 hover:text-white cursor-pointer">
                    <i class="fa-regular fa-copy"></i>
                </button>
            </div>

            <!-- SECURITY & KYC -->
            <div class="space-y-1">
                <span class="text-[10px] text-gray-400 uppercase tracking-wider font-bold ml-1">SECURITY & KYC</span>
                <div class="bg-[#121927] rounded-2xl gold-border overflow-hidden divide-y divide-gray-800/60 shadow-lg">
                    <div onclick="openFaceScanModal()" class="p-3.5 flex items-center justify-between cursor-pointer hover:bg-gray-800/40 transition-all">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 bg-yellow-500/10 text-yellow-400 rounded-xl flex items-center justify-center text-xs border border-yellow-500/20"><i class="fa-solid fa-face-smile"></i></div>
                            <div><h4 class="text-xs font-bold text-white">Face Recognition (Face Scan)</h4><p id="kyc-status-label" class="text-[10px] text-yellow-400 font-mono">Tap to Verify</p></div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-xs text-yellow-500"></i>
                    </div>
                </div>
            </div>
            <div class="text-center pt-2"><span class="text-[10px] text-yellow-500 font-mono font-bold">Afex v1.0</span></div>
        </div>
    </div>

    <!-- CUSTOM ANIMATED MODAL POPUP -->
    <div id="custom-modal" class="fixed inset-0 bg-[#080c14]/85 backdrop-blur-md z-[999] hidden items-center justify-center p-4 opacity-0 scale-95 pointer-events-none transition-all duration-300">
        <div class="bg-[#121927] w-full max-w-xs p-6 rounded-2xl gold-border text-center relative shadow-2xl pointer-events-auto">
            <div id="modal-icon-container" class="w-12 h-12 bg-yellow-500/10 border border-yellow-500/30 text-yellow-400 rounded-full flex items-center justify-center mx-auto mb-3 text-xl shadow-[0_0_10px_rgba(234,179,8,0.3)]">
                <i class="fa-solid fa-bell"></i>
            </div>
            <h3 id="modal-title" class="text-base font-bold text-yellow-400 mb-2">Notification</h3>
            <div id="modal-body" class="text-xs text-gray-300 mb-5 leading-relaxed">System information.</div>
            <button onclick="closeModal()" class="w-full bg-gradient-to-r from-yellow-500 to-amber-600 text-black text-xs py-3 rounded-xl font-black cursor-pointer shadow-lg hover:opacity-90">OK</button>
        </div>
    </div>

    <!-- MODAL FACE SCAN / KYC CAMERA -->
    <div id="kyc-modal" class="fixed inset-0 bg-[#080c14]/90 backdrop-blur-md z-[9999] hidden items-center justify-center p-4 opacity-0 scale-95 pointer-events-none transition-all duration-300">
        <div class="bg-[#121927] w-full max-w-sm p-5 rounded-2xl gold-border text-center relative shadow-2xl space-y-3 pointer-events-auto">
            <h3 class="text-sm font-bold text-yellow-400">Face Recognition & Liveness</h3>
            <p class="text-[10px] text-gray-300">Posisikan wajah Anda di dalam lingkaran kamera.</p>
            
            <!-- Kotak Kamera & Canvas -->
            <div class="relative w-full h-64 bg-black rounded-xl overflow-hidden border border-yellow-500/40 flex items-center justify-center">
                <video id="webcam" class="absolute inset-0 w-full h-full object-cover -scale-x-100" autoplay playsinline></video>
                <canvas id="output_canvas" class="absolute inset-0 w-full h-full pointer-events-none -scale-x-100"></canvas>
                
                <!-- Panduan Oval Wajah -->
                <div class="absolute w-36 h-48 border-2 border-dashed border-yellow-400 rounded-full pointer-events-none shadow-[0_0_15px_rgba(234,179,8,0.5)]"></div>
            </div>

            <div id="kyc-status-text" class="text-xs font-mono font-bold text-yellow-400">Mendeteksi wajah...</div>

            <div class="flex gap-2">
                <button onclick="closeKycModal()" class="w-1/2 bg-gray-800 text-gray-300 text-xs py-2.5 rounded-xl font-bold cursor-pointer">Batal</button>
                <button id="btn-submit-kyc" onclick="submitKycSuccess()" disabled class="w-1/2 bg-gray-700 text-gray-400 text-xs py-2.5 rounded-xl font-black cursor-not-allowed">Verifikasi</button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        let tg = window.Telegram?.WebApp;
        try { if(tg) { tg.expand(); tg.ready(); } } catch(e) {}

        let userTg = tg?.initDataUnsafe?.user;
        let userIdStr = userTg ? userTg.id.toString() : "8821716544";
        let displayName = userTg ? (userTg.username ? `@${userTg.username}` : userTg.first_name) : "Carmelo";

        function changeLanguage(langCode) {
            // Pengaturan bahasa dasar
        }

        /* GOOGLE MEDIAPIPE FACE DETECTION & SPREADSHEET KYC INTEGRATION */
        let faceDetectionInstance = null;
        let cameraInstance = null;
        let isFaceVerified = false;
        let detectedFaceHash = "";

        function openFaceScanModal() {
            let modal = document.getElementById('kyc-modal');
            modal.classList.remove('hidden', 'pointer-events-none');
            modal.classList.add('flex');
            setTimeout(() => { modal.classList.remove('opacity-0', 'scale-95'); modal.classList.add('opacity-100', 'scale-100'); }, 10);
            startCameraAndDetection();
        }

        function closeKycModal() {
            let modal = document.getElementById('kyc-modal');
            modal.classList.remove('opacity-100', 'scale-100'); modal.classList.add('opacity-0', 'scale-95');
            setTimeout(() => { modal.classList.remove('flex'); modal.classList.add('hidden', 'pointer-events-none'); }, 300);
            if (cameraInstance) {
                cameraInstance.stop();
            }
        }

        function startCameraAndDetection() {
            const videoElement = document.getElementById('webcam');
            const canvasElement = document.getElementById('output_canvas');
            const canvasCtx = canvasElement.getContext('2d');
            const statusText = document.getElementById('kyc-status-text');
            const submitBtn = document.getElementById('btn-submit-kyc');

            faceDetectionInstance = new FaceDetection({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
            });

            faceDetectionInstance.setOptions({
                model: 'short',
                minDetectionConfidence: 0.7
            });

            faceDetectionInstance.onResults((results) => {
                canvasCtx.save();
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
                canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

                if (results.detections && results.detections.length > 0) {
                    statusText.innerText = "✅ Wajah Terdeteksi! Sempurna.";
                    statusText.className = "text-xs font-mono font-bold text-green-400";
                    
                    // Generate string unik / Face Hash dari koordinat landmark wajah terdeteksi agar bisa divalidasi anti-duplikat
                    let box = results.detections[0].boundingBox;
                    detectedFaceHash = `FACE_${Math.round(box.xCenter * 1000)}_${Math.round(box.yCenter * 1000)}_${userIdStr.substring(0,4)}`;

                    submitBtn.disabled = false;
                    submitBtn.className = "w-1/2 bg-gradient-to-r from-yellow-500 to-amber-600 text-black text-xs py-2.5 rounded-xl font-black cursor-pointer shadow-md";
                    isFaceVerified = true;
                } else {
                    statusText.innerText = "⚠️ Posisikan wajah di dalam bingkai!";
                    statusText.className = "text-xs font-mono font-bold text-yellow-400";
                    
                    submitBtn.disabled = true;
                    submitBtn.className = "w-1/2 bg-gray-700 text-gray-400 text-xs py-2.5 rounded-xl font-black cursor-not-allowed";
                    isFaceVerified = false;
                }
                canvasCtx.restore();
            });

            cameraInstance = new Camera(videoElement, {
                onFrame: async () => {
                    canvasElement.width = videoElement.videoWidth;
                    canvasElement.height = videoElement.videoHeight;
                    await faceDetectionInstance.send({ image: videoElement });
                },
                width: 320,
                height: 240
            });

            cameraInstance.start().catch(err => {
                console.error("Gagal mengakses kamera:", err);
                statusText.innerText = "❌ Gagal membuka kamera perangkat!";
            });
        }

        function submitKycSuccess() {
            if (!isFaceVerified) return;

            closeKycModal();

            // URL Web App Google Apps Script Spreadsheet KYC Anda yang aktif[cite: 1]
            const scriptURL = 'https://script.google.com/macros/s/AKfycbzOT6t8pGV5rBwI-CSWgnJkLfuO8EAa79jJmh9sitn-A-p_uR1WqK84KMbOz-8vp_zSTg/exec'; 

            const requestData = {
                action: "FACE_KYC_VERIFIED",
                username: displayName,
                uid: userIdStr,
                faceHash: detectedFaceHash
            };

            // Kirim data ke Spreadsheet untuk pengecekan otomatis 1 wajah 1 akun
            fetch(scriptURL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(requestData)
            })
            .then(res => res.json())
            .then(resData => {
                if(resData.result === "success") {
                    document.getElementById('kyc-status-label').innerText = "VERIFIED";
                    document.getElementById('kyc-status-label').className = "text-[10px] text-green-400 font-mono font-bold";
                    showModal("Berhasil", resData.message, "fa-circle-check");
                } else {
                    document.getElementById('kyc-status-label').innerText = "REJECTED";
                    document.getElementById('kyc-status-label').className = "text-[10px] text-red-400 font-mono font-bold";
                    showModal("Gagal / Ditolak", resData.message, "fa-circle-exclamation");
                }
            })
            .catch(err => {
                console.error('Error kirim KYC:', err);
                showModal("Kesalahan", "Gagal menghubungi server database.", "fa-triangle-exclamation");
            });
        }

        function copyUID() { 
            navigator.clipboard.writeText(userIdStr); 
            showModal("Notification", "Copied!", "fa-circle-check"); 
        }

        function showModal(title, message, iconClass = "fa-bell") {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerHTML = message;
            document.getElementById('modal-icon-container').innerHTML = `<i class="fa-solid ${iconClass}"></i>`;
            let modal = document.getElementById('custom-modal');
            modal.classList.remove('hidden', 'pointer-events-none');
            modal.classList.add('flex');
            setTimeout(() => { modal.classList.remove('opacity-0', 'scale-95'); modal.classList.add('opacity-100', 'scale-100'); }, 10);
        }

        function closeModal() {
            let modal = document.getElementById('custom-modal');
            modal.classList.remove('opacity-100', 'scale-100'); modal.classList.add('opacity-0', 'scale-95');
            setTimeout(() => { modal.classList.remove('flex'); modal.classList.add('hidden', 'pointer-events-none'); }, 300);
        }
    </script>
</body>
</html>
