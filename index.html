<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AFEX Mining</title>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
          "lucide-react": "https://esm.sh/lucide-react@0.468.0?external=react"
        }
      }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel" data-type="module" data-presets="react">
import React, { useState, useEffect } from 'react';
import { 
  Home, Gift, Trophy, Wallet, Settings, AlertTriangle, 
  Copy, Activity, ShieldAlert, Zap, CheckCircle2, XCircle
} from 'lucide-react';

// --- TRANSLATIONS ---
const i18n = {
  en: {
    home: "Home", campaign: "Campaign", leaderboard: "Rank", wallet: "Wallet",
    miningActive: "Mining Active", miningStopped: "Mining Stopped",
    tier: "Tier", balance: "Balance", watchAd: "Watch Ad",
    adReward: "Reward: $0.005 / Ad", pointReward: "1 Ad = 1 Point",
    referral: "Referral Link", copy: "Copy Link", copied: "Copied!",
    giveawayTitle: "USDT & iPhone Giveaway!", giveawayDesc: "Collect points by watching ads. Top users win!",
    topMiners: "Top 10 Miners", points: "pts",
    connectEVM: "Connect EVM (BSC/ETH)", connectTON: "Connect TonKeeper", connected: "Connected",
    withdraw: "Withdraw", asset: "Asset", network: "Network", address: "Wallet Address",
    amount: "Amount", autoWD: "Auto-Withdraw $0.10 (1x Only)", standardWD: "Standard Withdraw",
    reqNotMet: "Requirement Not Met", wrongNetwork: "AFEX only available on BSC",
    txHash: "TxHash / Receipt", adBlockTitle: "Ad Blocker Detected",
    adBlockDesc: "Please disable AdGuard or any Ad Blocker to continue mining and watching ads.",
    understand: "I Understand", startMining: "Start Mining", stopMining: "Stop Mining"
  },
  id: {
    home: "Beranda", campaign: "Kampanye", leaderboard: "Peringkat", wallet: "Dompet",
    miningActive: "Penambangan Aktif", miningStopped: "Penambangan Berhenti",
    tier: "Tier", balance: "Saldo", watchAd: "Tonton Iklan",
    adReward: "Hadiah: $0.005 / Iklan", pointReward: "1 Iklan = 1 Poin",
    referral: "Tautan Rujukan", copy: "Salin Tautan", copied: "Tersalin!",
    giveawayTitle: "Bagi-Bagi USDT & iPhone!", giveawayDesc: "Kumpulkan poin dengan menonton iklan. Pengguna teratas menang!",
    topMiners: "10 Penambang Teratas", points: "poin",
    connectEVM: "Sambungkan EVM (BSC/ETH)", connectTON: "Sambungkan TonKeeper", connected: "Tersambung",
    withdraw: "Tarik Saldo", asset: "Aset", network: "Jaringan", address: "Alamat Dompet",
    amount: "Jumlah", autoWD: "Tarik Otomatis $0.10 (Hanya 1x)", standardWD: "Penarikan Standar",
    reqNotMet: "Syarat Belum Terpenuhi", wrongNetwork: "AFEX hanya tersedia di jaringan BSC",
    txHash: "TxHash / Bukti", adBlockTitle: "Pemblokir Iklan Terdeteksi",
    adBlockDesc: "Harap matikan AdGuard atau Pemblokir Iklan untuk melanjutkan penambangan dan menonton iklan.",
    understand: "Saya Mengerti", startMining: "Mulai Menambang", stopMining: "Hentikan Penambangan"
  }
};

// --- MOCK LEADERBOARD DATA ---
const mockLeaderboard = [
  { id: 1, name: "CryptoKing", points: 15420, isUser: false },
  { id: 2, name: "SatoshiN", points: 14200, isUser: false },
  { id: 3, name: "AFEX_Whale", points: 13850, isUser: false },
  { id: 4, name: "MoonWalker", points: 12100, isUser: false },
  { id: 5, name: "You (Demo)", points: 45, isUser: true },
  { id: 6, name: "DiamondHands", points: 8000, isUser: false },
  { id: 7, name: "TonLover", points: 7500, isUser: false },
  { id: 8, name: "BullRun2027", points: 6200, isUser: false },
  { id: 9, name: "BscMiner", points: 5100, isUser: false },
  { id: 10, name: "PancakeSwapFan", points: 4900, isUser: false },
];

export default function App() {
  // GLOBAL APP STATE
  const [lang, setLang] = useState('id'); // Default English Language
  const [view, setView] = useState('home');
  const [tier] = useState(3);
  const [balanceUSDT, setBalanceUSDT] = useState(0.09); // Close to 0.10 to demo fast
  const [balanceAFEX, setBalanceAFEX] = useState(150);
  const [points, setPoints] = useState(45);
  const [isMining, setIsMining] = useState(true);
  const [hasClaimedFirstWD, setHasClaimedFirstWD] = useState(false);
  const [showAdBlock, setShowAdBlock] = useState(true); // Demo: show on first load
  const [copied, setCopied] = useState(false);
  
  // WALLET STATE
  const [wallets, setWallets] = useState({ evm: false, ton: false });
  const [wdAsset, setWdAsset] = useState('USDT');
  const [wdNetwork, setWdNetwork] = useState('BSC');
  const [wdAddress, setWdAddress] = useState('');
  const [txHash, setTxHash] = useState('');
  const [wdMessage, setWdMessage] = useState('');

  const t = (key) => i18n[lang][key];

  // SIMULATE WATCHING AD
  const handleWatchAd = () => {
    setBalanceUSDT(prev => +(prev + 0.005).toFixed(3)); 
    setPoints(prev => prev + 1);
  };

  const copyReferral = () => {
    navigator.clipboard.writeText("https://t.me/AFEX_Mining_Bot?start=ref_12345");
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  };

  // WITHDRAWAL LOGIC
  const handleWithdraw = () => {
    if (wdAsset === 'AFEX' && wdNetwork !== 'BSC') return;
    
    if (wdAsset === 'USDT') {
      if (!hasClaimedFirstWD && balanceUSDT >= 0.10) {
        // Auto-Execute $0.10
        setBalanceUSDT(prev => +(prev - 0.10).toFixed(3));
        setHasClaimedFirstWD(true);
        setTxHash("0x" + Math.random().toString(16).slice(2, 40));
        setWdMessage("Auto-Withdraw $0.10 Success!");
      } else if (hasClaimedFirstWD && balanceUSDT >= 1.50) {
        // Standard Execution $1.50
        setBalanceUSDT(prev => +(prev - 1.50).toFixed(3));
        setTxHash("0x" + Math.random().toString(16).slice(2, 40));
        setWdMessage("Withdraw $1.50 Success!");
      }
    } else if (wdAsset === 'AFEX') {
       if (balanceAFEX >= 1000) { // arbitrary AFEX minimum
         setBalanceAFEX(prev => prev - 1000);
         setTxHash("0x" + Math.random().toString(16).slice(2, 40));
         setWdMessage("AFEX Withdraw Success!");
       }
    }
    setTimeout(() => setWdMessage(''), 4000);
  };

  // VALIDATE WITHDRAW BUTTON
  const isNetworkValid = wdAsset === 'USDT' || (wdAsset === 'AFEX' && wdNetwork === 'BSC');
  const reqAmount = wdAsset === 'AFEX' ? 1000 : (hasClaimedFirstWD ? (tier === 1 ? 3.0 : 1.5) : 0.1);
  const currentAssetBalance = wdAsset === 'AFEX' ? balanceAFEX : balanceUSDT;
  const canWithdraw = isNetworkValid && currentAssetBalance >= reqAmount && wdAddress.length > 5;

  return (
    <div className="flex flex-col h-screen w-full max-w-md mx-auto bg-slate-950 text-slate-200 font-sans shadow-2xl overflow-hidden relative">
      
      {/* HEADER */}
      <header className="flex justify-between items-center p-4 bg-slate-900 border-b border-slate-800 shrink-0">
        <div className="flex items-center gap-2">
          <div className="w-8 h-8 rounded-full bg-gradient-to-tr from-cyan-400 to-purple-500 flex items-center justify-center font-bold text-white shadow-[0_0_10px_rgba(34,211,238,0.5)]">
            A
          </div>
          <div>
            <h1 className="font-bold text-md leading-tight text-white">AFEX MINING</h1>
            <p className="text-xs text-cyan-400">{t('tier')} {tier} • {hasClaimedFirstWD ? "Pro" : "New"}</p>
          </div>
        </div>
        <button 
          onClick={() => setLang(lang === 'en' ? 'id' : 'en')}
          className="px-3 py-1 bg-slate-800 rounded-full text-xs font-semibold border border-slate-700 active:scale-95 transition-transform"
        >
          {lang === 'en' ? '🇮🇩 ID' : '🇬🇧 EN'}
        </button>
      </header>

      {/* MAIN CONTENT AREA */}
      <main className="flex-1 overflow-y-auto pb-24 p-4 space-y-6 custom-scrollbar">
        
        {/* --- HOME VIEW --- */}
        {view === 'home' && (
          <div className="space-y-6 animate-in fade-in slide-in-from-bottom-2 duration-300">
            {/* Balances */}
            <div className="grid grid-cols-2 gap-3">
              <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 flex flex-col items-center justify-center">
                <span className="text-slate-400 text-xs mb-1 uppercase tracking-wider">{t('balance')} USDT</span>
                <span className="text-2xl font-bold text-white">${balanceUSDT.toFixed(3)}</span>
              </div>
              <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 flex flex-col items-center justify-center">
                <span className="text-slate-400 text-xs mb-1 uppercase tracking-wider">{t('balance')} AFEX</span>
                <span className="text-2xl font-bold text-cyan-400">{balanceAFEX.toFixed(2)}</span>
              </div>
            </div>

            {/* Simulated Chart */}
            <div className="bg-slate-900 rounded-xl border border-slate-800 p-4 space-y-2">
              <div className="flex justify-between items-center text-sm">
                <span className="font-semibold text-white">AFEX/USDT (BSC)</span>
                <span className="text-cyan-400 flex items-center gap-1"><Activity size={14}/> +12.4%</span>
              </div>
              <div className="h-32 w-full bg-slate-950 rounded-lg overflow-hidden relative border border-slate-800/50 flex items-end">
                {/* SVG Chart Placeholder */}
                <svg viewBox="0 0 100 40" preserveAspectRatio="none" className="w-full h-full stroke-cyan-500 fill-cyan-500/20">
                  <polyline points="0,40 10,35 20,38 30,25 40,28 50,15 60,18 70,5 80,10 90,2 100,5 100,40" />
                </svg>
                <div className="absolute inset-0 bg-gradient-to-t from-slate-950/50 to-transparent"></div>
              </div>
            </div>

            {/* Mining Status */}
            <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 text-center space-y-4">
              <div className="flex justify-center">
                <div className={`relative w-20 h-20 rounded-full flex items-center justify-center ${isMining ? 'bg-cyan-500/20' : 'bg-slate-800'} transition-colors duration-500`}>
                  {isMining && <div className="absolute inset-0 rounded-full border-2 border-cyan-400 animate-ping opacity-20"></div>}
                  <Zap size={32} className={`${isMining ? 'text-cyan-400' : 'text-slate-500'}`} />
                </div>
              </div>
              <div>
                <h3 className="font-bold text-white text-lg">{isMining ? t('miningActive') : t('miningStopped')}</h3>
                <p className="text-xs text-slate-400">+50 AFEX / Day</p>
              </div>
              <button 
                onClick={() => setIsMining(!isMining)}
                className={`w-full py-3 rounded-lg font-bold transition-all ${isMining ? 'bg-slate-800 text-slate-300' : 'bg-gradient-to-r from-cyan-500 to-blue-500 text-white shadow-lg shadow-cyan-500/25'}`}
              >
                {isMining ? t('stopMining') : t('startMining')}
              </button>
            </div>

            {/* Referral */}
            <div className="bg-slate-900 p-4 rounded-xl border border-slate-800">
              <span className="text-sm text-slate-400 block mb-2">{t('referral')}</span>
              <div className="flex gap-2">
                <input readOnly value="https://t.me/AFEX_bot?start=123" className="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-300 outline-none" />
                <button onClick={copyReferral} className="bg-purple-600 text-white px-4 py-2 rounded-lg flex items-center gap-2 font-semibold active:bg-purple-700 transition-colors">
                  {copied ? <CheckCircle2 size={16}/> : <Copy size={16}/>}
                </button>
              </div>
            </div>
          </div>
        )}

        {/* --- CAMPAIGN VIEW --- */}
        {view === 'campaign' && (
          <div className="space-y-6 animate-in fade-in slide-in-from-bottom-2 duration-300">
            <div className="bg-gradient-to-br from-purple-900 to-slate-900 p-6 rounded-xl border border-purple-500/30 text-center relative overflow-hidden">
              <Gift size={48} className="text-purple-400 mx-auto mb-3 opacity-80" />
              <h2 className="text-xl font-bold text-white mb-2">{t('giveawayTitle')}</h2>
              <p className="text-sm text-slate-300 mb-4">{t('giveawayDesc')}</p>
              <div className="bg-slate-950/50 py-2 rounded-lg border border-purple-500/20">
                <span className="text-xl font-bold text-purple-400">{points} {t('points')}</span>
              </div>
            </div>

            <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 text-center space-y-4">
              <div className="flex items-center justify-center gap-2 text-sm text-slate-400">
                <Activity size={16} className="text-cyan-400"/> {t('pointReward')}
              </div>
              <div className="text-xs text-slate-500 border border-slate-800 bg-slate-950 p-2 rounded">
                {t('adReward')} (Tier 3)
              </div>
              <button onClick={handleWatchAd} className="w-full py-4 bg-gradient-to-r from-cyan-500 to-blue-500 rounded-lg font-bold text-white text-lg shadow-lg shadow-cyan-500/30 active:scale-[0.98] transition-all">
                {t('watchAd')}
              </button>
            </div>
          </div>
        )}

        {/* --- LEADERBOARD VIEW --- */}
        {view === 'leaderboard' && (
          <div className="space-y-4 animate-in fade-in slide-in-from-bottom-2 duration-300">
            <h2 className="text-lg font-bold text-white flex items-center gap-2"><Trophy className="text-yellow-400"/> {t('topMiners')}</h2>
            <div className="bg-slate-900 rounded-xl border border-slate-800 overflow-hidden">
              {mockLeaderboard.map((user, idx) => (
                <div key={user.id} className={`flex items-center justify-between p-4 border-b border-slate-800/50 last:border-0 ${user.isUser ? 'bg-cyan-950/30' : ''}`}>
                  <div className="flex items-center gap-3">
                    <span className={`font-bold w-6 text-center ${idx === 0 ? 'text-yellow-400' : idx === 1 ? 'text-slate-300' : idx === 2 ? 'text-amber-600' : 'text-slate-500'}`}>
                      #{idx + 1}
                    </span>
                    <span className={`font-semibold ${user.isUser ? 'text-cyan-400' : 'text-slate-200'}`}>{user.name}</span>
                  </div>
                  <span className="text-sm font-mono text-purple-400">{user.points.toLocaleString()} pts</span>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* --- WALLET VIEW --- */}
        {view === 'wallet' && (
          <div className="space-y-6 animate-in fade-in slide-in-from-bottom-2 duration-300">
            
            {/* Wallet Connections */}
            <div className="grid grid-cols-2 gap-3">
              <button 
                onClick={() => setWallets({...wallets, evm: true})}
                className={`p-3 rounded-xl border flex flex-col items-center justify-center text-sm transition-colors ${wallets.evm ? 'bg-cyan-950/30 border-cyan-500/50 text-cyan-400' : 'bg-slate-900 border-slate-800 text-slate-400 active:bg-slate-800'}`}
              >
                <div className="w-8 h-8 bg-slate-950 rounded-full flex items-center justify-center mb-2">💎</div>
                {wallets.evm ? t('connected') : t('connectEVM')}
              </button>
              <button 
                onClick={() => setWallets({...wallets, ton: true})}
                className={`p-3 rounded-xl border flex flex-col items-center justify-center text-sm transition-colors ${wallets.ton ? 'bg-blue-950/30 border-blue-500/50 text-blue-400' : 'bg-slate-900 border-slate-800 text-slate-400 active:bg-slate-800'}`}
              >
                <div className="w-8 h-8 bg-slate-950 rounded-full flex items-center justify-center mb-2">🔷</div>
                {wallets.ton ? t('connected') : t('connectTON')}
              </button>
            </div>

            {/* Withdraw Form */}
            <div className="bg-slate-900 p-5 rounded-xl border border-slate-800 space-y-4">
              <h3 className="font-bold text-white border-b border-slate-800 pb-2 mb-4">{t('withdraw')}</h3>
              
              <div className="grid grid-cols-2 gap-4">
                <div className="space-y-1">
                  <label className="text-xs text-slate-400">{t('asset')}</label>
                  <select value={wdAsset} onChange={(e) => setWdAsset(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-sm text-white outline-none">
                    <option value="USDT">USDT</option>
                    <option value="AFEX">AFEX Token</option>
                  </select>
                </div>
                <div className="space-y-1">
                  <label className="text-xs text-slate-400">{t('network')}</label>
                  <select value={wdNetwork} onChange={(e) => setWdNetwork(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-sm text-white outline-none">
                    <option value="BSC">BSC (BEP-20)</option>
                    <option value="TON">TON</option>
                    <option value="TRC20">TRC-20</option>
                    <option value="ETH">ETH (ERC-20)</option>
                  </select>
                </div>
              </div>

              {!isNetworkValid && (
                <div className="flex items-center gap-2 text-xs text-red-400 bg-red-950/30 p-2 rounded">
                  <XCircle size={14}/> {t('wrongNetwork')}
                </div>
              )}

              <div className="space-y-1">
                <label className="text-xs text-slate-400">{t('address')}</label>
                <input 
                  type="text" 
                  value={wdAddress}
                  onChange={(e) => setWdAddress(e.target.value)}
                  placeholder="0x... or UQ..."
                  className="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-white outline-none focus:border-cyan-500 transition-colors"
                />
              </div>

              <div className="space-y-1">
                <label className="text-xs text-slate-400">{t('amount')} (Min: {reqAmount})</label>
                <input 
                  type="text" 
                  readOnly={wdAsset === 'USDT' && !hasClaimedFirstWD}
                  value={wdAsset === 'USDT' && !hasClaimedFirstWD ? "0.10" : reqAmount}
                  className="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-slate-500 outline-none cursor-not-allowed"
                />
              </div>

              {/* Action Button */}
              <button 
                disabled={!canWithdraw}
                onClick={handleWithdraw}
                className={`w-full py-3 rounded-lg font-bold transition-all flex items-center justify-center gap-2
                  ${canWithdraw ? 'bg-cyan-500 text-slate-900 hover:bg-cyan-400 active:scale-[0.98]' : 'bg-slate-800 text-slate-500 cursor-not-allowed'}
                `}
              >
                {canWithdraw ? <CheckCircle2 size={18}/> : <AlertTriangle size={18}/>}
                {!canWithdraw 
                  ? t('reqNotMet') 
                  : (wdAsset === 'USDT' && !hasClaimedFirstWD ? t('autoWD') : t('standardWD'))
                }
              </button>

              {/* Status Message & TxHash */}
              {wdMessage && (
                <div className="mt-4 p-3 bg-green-950/30 border border-green-500/50 rounded-lg animate-in zoom-in duration-200">
                  <p className="text-green-400 text-sm font-bold mb-1">{wdMessage}</p>
                  <div className="space-y-1">
                    <span className="text-xs text-slate-400 block">{t('txHash')}:</span>
                    <p className="text-xs text-slate-300 font-mono break-all">{txHash}</p>
                  </div>
                </div>
              )}

            </div>
          </div>
        )}
      </main>

      {/* BOTTOM NAVIGATION */}
      <nav className="fixed bottom-0 w-full max-w-md h-16 bg-slate-950 border-t border-slate-800 flex justify-around items-center px-2 z-10">
        {[
          { id: 'home', icon: Home, label: t('home') },
          { id: 'campaign', icon: Gift, label: t('campaign') },
          { id: 'leaderboard', icon: Trophy, label: t('leaderboard') },
          { id: 'wallet', icon: Wallet, label: t('wallet') }
        ].map((item) => (
          <button
            key={item.id}
            onClick={() => setView(item.id)}
            className={`flex flex-col items-center justify-center w-16 h-full gap-1 transition-colors ${view === item.id ? 'text-cyan-400' : 'text-slate-500 hover:text-slate-400'}`}
          >
            <item.icon size={20} className={view === item.id ? 'fill-cyan-400/20' : ''} />
            <span className="text-[10px] font-medium">{item.label}</span>
          </button>
        ))}
      </nav>

      {/* AD BLOCK WARNING MODAL (Simulated) */}
      {showAdBlock && (
        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-red-500/30 rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl animate-in zoom-in-95 duration-300">
            <ShieldAlert size={48} className="text-red-500 mx-auto mb-4" />
            <h2 className="text-xl font-bold text-white mb-2">{t('adBlockTitle')}</h2>
            <p className="text-sm text-slate-400 mb-6">{t('adBlockDesc')}</p>
            <button 
              onClick={() => setShowAdBlock(false)}
              className="w-full py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-lg font-bold transition-colors"
            >
              {t('understand')}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

import { createRoot } from 'react-dom/client';

createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
